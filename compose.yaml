services:
  lometa:
    build: .
    restart: unless-stopped
    cpus: 1.5
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=512
      LIMITLESS_API_KEY: ${LIMITLESS_API_KEY:-}
