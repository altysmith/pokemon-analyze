services:
  lometa:
    build: .
    restart: unless-stopped
    cpus: 1.5
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=512
      LIMITLESS_API_KEY: ${LIMITLESS_API_KEY:-}
      JP_DB_PATH: /data/japan.sqlite
    volumes:
      - japan-data:/data

  japan-sync:
    build:
      context: .
      target: japan-sync
    restart: unless-stopped
    cpus: 0.5
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      JP_DB_PATH: /data/japan.sqlite
      JP_SYNC_INTERVAL_HOURS: ${JP_SYNC_INTERVAL_HOURS:-24}
      JP_SYNC_PAGES: ${JP_SYNC_PAGES:-10}
      JP_SYNC_MAX_EVENTS: ${JP_SYNC_MAX_EVENTS:-100}
    volumes:
      - japan-data:/data

volumes:
  japan-data:
